<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Калькулятор стоимости заказа</title>
    <script src="calc.js" defer></script>
    <style>
        :root {
            --bg: #f3f4f8;
            --card: #ffffff;
            --text: #1d2130;
            --muted: #5d6478;
            --border: #cfd4e2;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #c62828;
            --ok-bg: #eef2ff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12141c;
                --card: #1c1f2b;
                --text: #eceef6;
                --muted: #9aa1b8;
                --border: #363b50;
                --accent: #7c83ff;
                --accent-hover: #9aa0ff;
                --danger: #ff7b7b;
                --ok-bg: #242842;
            }
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        .card {
            width: 100%;
            max-width: 34rem;
            padding: 2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.5rem;
        }
        .lead {
            margin: 0 0 1.5rem;
            color: var(--muted);
        }
        .field {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 0.7rem 0.85rem;
            font: inherit;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
        }
        select:focus, input:focus, button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 1px;
        }
        input.invalid {
            border-color: var(--danger);
        }
        .error {
            min-height: 1.25rem;
            margin: 0.35rem 0 0;
            font-size: 0.9rem;
            color: var(--danger);
        }
        button {
            width: 100%;
            padding: 0.8rem 1rem;
            font: inherit;
            font-weight: 600;
            color: #ffffff;
            background: var(--accent);
            border: 0;
            border-radius: 0.6rem;
            cursor: pointer;
        }
        button:hover {
            background: var(--accent-hover);
        }
        .result {
            margin: 1.25rem 0 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .result:not(:empty) {
            padding: 1rem;
            background: var(--ok-bg);
            border-radius: 0.6rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Калькулятор стоимости заказа</h1>
        <p class="lead">Выберите товар, укажите количество и нажмите кнопку.</p>

        <form id="calc-form">
            <div class="field">
                <label for="product">Товар</label>
                <select id="product">
                    <option value="695">Средство для очистки труб — 695 ₽</option>
                    <option value="143">Тряпка половая — 143 ₽</option>
                    <option value="559">Вантус — 559 ₽</option>
                    <option value="399">Швабра — 399 ₽</option>
                    <option value="83">Ведро — 83 ₽</option>
                </select>
            </div>

            <div class="field">
                <label for="quantity">Количество, шт.</label>
                <input type="text" id="quantity" value="1" autocomplete="off"
                    inputmode="numeric" aria-describedby="error">
                <p id="error" class="error" role="alert"></p>
            </div>

            <button type="button" id="calc-button">Посчитать стоимость</button>
        </form>

        <p id="result" class="result" aria-live="polite"></p>
    </main>
</body>
</html>
